name: Build and release Hyperion

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*-r*'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: truenas-compose.yaml
      COMPOSE_PROJECT_NAME: hyperion-smoke
      HYPERION_CONFIG_DIR: /tmp/hyperion-config
      PUID: "12345"
      PGID: "23456"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-r[1-9][0-9]*$ ]]; then
            echo "Expected a release tag such as v2.2.1-r1." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          expected="ghcr.io/pjamroziak/hyperion-docker:${GITHUB_REF_NAME#v}"
          if [[ "$(docker compose config --images)" != "$expected" ]]; then
            echo "The Compose image must match the release tag: $expected" >&2
            exit 1
          fi
      - name: Validate Compose and read the image name
        id: compose
        run: |
          docker compose config --quiet
          image="$(docker compose config --images)"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the AMD64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.compose.outputs.image }}
          pull: true
          load: true
          cache-from: type=gha,scope=hyperion-amd64
          cache-to: type=gha,scope=hyperion-amd64,mode=max,ignore-error=true
          no-cache-filters: ${{ github.ref_type == 'tag' && 'runtime' || '' }}
      - name: Check the image version and platform
        shell: bash
        env:
          IMAGE: ${{ steps.compose.outputs.image }}
        run: |
          image="$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
          image_tag="${image##*:}"
          if [[ "${image_tag%-r*}" != "$version" ]]; then
            echo "The image tag must match the upstream Hyperion version: $version" >&2
            exit 1
          fi
      - name: Check the web UI, startup logs and database ownership
        run: |
          sudo install -d -m 0750 -o "$PUID" -g "$PGID" "$HYPERION_CONFIG_DIR"
          docker compose up --detach --pull never --wait --wait-timeout 90
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/
          docker compose logs --no-color hyperion | grep -F 'Starting Hyperion in non-GUI mode, DB is read/write'
          database="$HYPERION_CONFIG_DIR/db/hyperion.db"
          sudo test -s "$database"
          test "$(sudo stat -c '%u:%g' "$database")" = "$PUID:$PGID"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Export the tested image
        if: github.ref_type == 'tag'
        shell: bash
        env:
          IMAGE: ${{ steps.compose.outputs.image }}
        run: |
          docker image tag "$IMAGE" hyperion-release:amd64
          docker image save hyperion-release:amd64 | gzip -1 > hyperion-amd64.tar.gz
      - name: Upload the tested image
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperion-image-amd64
          path: hyperion-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  publish:
    name: Publish the release to GHCR
    if: github.ref_type == 'tag' && github.repository == 'pjamroziak/hyperion-docker'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: hyperion-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hyperion-image-amd64
          path: release-images
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the AMD64 image
        run: |
          image="ghcr.io/pjamroziak/hyperion-docker:${GITHUB_REF_NAME#v}"
          bash .github/scripts/publish-image.sh "$image" release-images/hyperion-amd64.tar.gz "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
