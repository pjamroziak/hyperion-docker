name: Build and release Hyperion

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*-r*'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      COMPOSE_FILE: truenas-compose.yaml
      COMPOSE_PROJECT_NAME: hyperion-smoke
      HYPERION_CONFIG_DIR: /tmp/hyperion-config
      PUID: "12345"
      PGID: "23456"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-r[1-9][0-9]*$ ]]; then
            echo "Expected a release tag such as v2.2.1-r1." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          expected="ghcr.io/pjamroziak/hyperion-docker:${GITHUB_REF_NAME#v}"
          if [[ "$(docker compose config --images)" != "$expected" ]]; then
            echo "The Compose image must match the release tag: $expected" >&2
            exit 1
          fi
      - name: Validate Compose and build the image
        shell: bash
        run: |
          docker compose config --quiet
          image="$(docker compose config --images)"
          docker build --tag "$image" .
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
          image_tag="${image##*:}"
          if [[ "${image_tag%-r*}" != "$version" ]]; then
            echo "The image tag must match the upstream Hyperion version: $version" >&2
            exit 1
          fi
      - name: Check the web UI, startup logs and database ownership
        run: |
          sudo install -d -m 0750 -o "$PUID" -g "$PGID" "$HYPERION_CONFIG_DIR"
          docker compose up --detach --pull never --wait --wait-timeout 90
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/
          docker compose logs --no-color hyperion | grep -F 'Starting Hyperion in non-GUI mode, DB is read/write'
          database="$HYPERION_CONFIG_DIR/db/hyperion.db"
          sudo test -s "$database"
          test "$(sudo stat -c '%u:%g' "$database")" = "$PUID:$PGID"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Export the tested image
        if: github.event_name == 'push'
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          image="$(docker compose config --images)"
          archive_tag="hyperion-release:$ARCHITECTURE"
          docker image tag "$image" "$archive_tag"
          docker image save "$archive_tag" | gzip -1 > "hyperion-$ARCHITECTURE.tar.gz"
      - name: Upload the tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperion-image-${{ matrix.arch }}
          path: hyperion-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  publish:
    name: Publish the release to GHCR
    if: github.event_name == 'push' && github.repository == 'pjamroziak/hyperion-docker'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: hyperion-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hyperion-image-*
          path: release-images
          merge-multiple: true
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the multi-platform image
        run: |
          image="ghcr.io/pjamroziak/hyperion-docker:${GITHUB_REF_NAME#v}"
          bash .github/scripts/publish-image.sh "$image" release-images "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
